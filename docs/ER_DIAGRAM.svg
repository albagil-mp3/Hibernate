<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .box { fill:#fff8ff; stroke:#7B1FA2; stroke-width:2; }
    .title { font: bold 16px sans-serif; fill:#3e3e3e; }
    .field { font: 13px monospace; fill:#222; }
    .fk { stroke-dasharray:4 2; stroke:#666; }
    .line { stroke:#444; stroke-width:1.5; }
  </style>

  <!-- Client -->
  <rect x="40" y="40" width="320" height="160" rx="8" class="box" />
  <text x="60" y="64" class="title">CLIENT</text>
  <text x="60" y="90" class="field">id INT PK</text>
  <text x="60" y="110" class="field">code VARCHAR(20)</text>
  <text x="60" y="130" class="field">name VARCHAR(50)</text>
  <text x="60" y="150" class="field">dni VARCHAR(9)</text>

  <!-- Item -->
  <rect x="840" y="40" width="320" height="140" rx="8" class="box" />
  <text x="860" y="64" class="title">ITEM</text>
  <text x="860" y="90" class="field">id INT PK</text>
  <text x="860" y="110" class="field">code VARCHAR(20)</text>
  <text x="860" y="130" class="field">name VARCHAR(100)</text>

  <!-- Delivery Note -->
  <rect x="220" y="260" width="360" height="120" rx="8" class="box" />
  <text x="240" y="284" class="title">DELIVERY_NOTE</text>
  <text x="240" y="310" class="field">id INT PK</text>
  <text x="240" y="330" class="field">code VARCHAR(40)</text>
  <text x="240" y="350" class="field">client_id INT FK → CLIENT(id)</text>

  <!-- Invoice -->
  <rect x="640" y="260" width="360" height="120" rx="8" class="box" />
  <text x="660" y="284" class="title">INVOICE</text>
  <text x="660" y="310" class="field">id INT PK</text>
  <text x="660" y="330" class="field">code VARCHAR(40)</text>
  <text x="660" y="350" class="field">client_id INT FK → CLIENT(id)</text>

  <!-- Delivery Line -->
  <rect x="380" y="460" width="420" height="140" rx="8" class="box" />
  <text x="400" y="484" class="title">DELIVERY_LINE</text>
  <text x="400" y="510" class="field">id INT PK</text>
  <text x="400" y="530" class="field">delivery_note_id INT FK → DELIVERY_NOTE(id)</text>
  <text x="400" y="550" class="field">invoice_id INT FK → INVOICE(id)</text>
  <text x="400" y="570" class="field">item_id INT FK → ITEM(id)</text>

  <!-- Relationships lines -->
  <line x1="200" y1="200" x2="260" y2="260" class="line" />
  <line x1="360" y1="320" x2="380" y2="460" class="line" />
  <line x1="720" y1="320" x2="800" y2="260" class="line" />
  <line x1="900" y1="180" x2="820" y2="320" class="line" />
  <line x1="730" y1="420" x2="760" y2="460" class="line" />

  <!-- Labels -->
  <text x="260" y="240" font-family="sans-serif" font-size="12" fill="#333">Client 1..* DeliveryNotes</text>
  <text x="760" y="240" font-family="sans-serif" font-size="12" fill="#333">Client 1..* Invoices</text>
  <text x="470" y="420" font-family="sans-serif" font-size="12" fill="#333">DeliveryNote 1..* DeliveryLines</text>
  <text x="860" y="420" font-family="sans-serif" font-size="12" fill="#333">Invoice 1..* DeliveryLines</text>
  <text x="700" y="120" font-family="sans-serif" font-size="12" fill="#333">Item 1..* DeliveryLines</text>

</svg>
