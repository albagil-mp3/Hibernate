<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .box { fill:#f8fbff; stroke:#1f4e79; stroke-width:2; }
    .title { font: bold 16px sans-serif; fill:#17324d; }
    .field { font: 13px monospace; fill:#1f1f1f; }
    .line { stroke:#3d4d5c; stroke-width:1.8; }
    .label { font: 12px sans-serif; fill:#2b2b2b; }
  </style>

  <text x="540" y="34" class="title">Diagrama ER - Hibernate Billing System</text>

  <rect x="40" y="70" width="300" height="180" rx="8" class="box" />
  <text x="60" y="96" class="title">PARTY</text>
  <text x="60" y="124" class="field">id BIGINT PK</text>
  <text x="60" y="144" class="field">name VARCHAR(100)</text>
  <text x="60" y="164" class="field">email VARCHAR(100)</text>
  <text x="60" y="184" class="field">city VARCHAR(100)</text>
  <text x="60" y="204" class="field">province ENUM</text>

  <rect x="390" y="70" width="300" height="170" rx="8" class="box" />
  <text x="410" y="96" class="title">CLIENT</text>
  <text x="410" y="124" class="field">id BIGINT PK/FK -> PARTY.id</text>
  <text x="410" y="144" class="field">dni VARCHAR(9) UNIQUE</text>
  <text x="410" y="164" class="field">code VARCHAR(20) UNIQUE</text>
  <text x="410" y="184" class="field">payment_method ENUM</text>

  <rect x="740" y="70" width="300" height="170" rx="8" class="box" />
  <text x="760" y="96" class="title">SUPPLIER</text>
  <text x="760" y="124" class="field">id BIGINT PK/FK -> PARTY.id</text>
  <text x="760" y="144" class="field">tax_id VARCHAR(20) UNIQUE</text>
  <text x="760" y="164" class="field">code VARCHAR(20) UNIQUE</text>
  <text x="760" y="184" class="field">active BOOLEAN</text>

  <rect x="1090" y="70" width="260" height="150" rx="8" class="box" />
  <text x="1110" y="96" class="title">ITEM</text>
  <text x="1110" y="124" class="field">id BIGINT PK</text>
  <text x="1110" y="144" class="field">code VARCHAR(50) UNIQUE</text>
  <text x="1110" y="164" class="field">description VARCHAR(255)</text>
  <text x="1110" y="184" class="field">supplier_id BIGINT FK</text>

  <rect x="280" y="330" width="360" height="170" rx="8" class="box" />
  <text x="300" y="356" class="title">BUSINESS_DOCUMENT</text>
  <text x="300" y="384" class="field">id BIGINT PK</text>
  <text x="300" y="404" class="field">doc_date DATE</text>
  <text x="300" y="424" class="field">code VARCHAR(50) UNIQUE</text>
  <text x="300" y="444" class="field">party_id BIGINT FK -> PARTY.id</text>
  <text x="300" y="464" class="field">subtotal/taxes/total DECIMAL</text>

  <rect x="690" y="330" width="300" height="120" rx="8" class="box" />
  <text x="710" y="356" class="title">DELIVERY_NOTE</text>
  <text x="710" y="384" class="field">id BIGINT PK/FK -> BUSINESS_DOCUMENT.id</text>
  <text x="710" y="404" class="field">delivered BOOLEAN</text>
  <text x="710" y="424" class="field">invoiced BOOLEAN</text>

  <rect x="1030" y="330" width="300" height="90" rx="8" class="box" />
  <text x="1050" y="356" class="title">INVOICE</text>
  <text x="1050" y="384" class="field">id BIGINT PK/FK -> BUSINESS_DOCUMENT.id</text>

  <rect x="720" y="560" width="420" height="140" rx="8" class="box" />
  <text x="740" y="586" class="title">DOCUMENT_LINE</text>
  <text x="740" y="614" class="field">id BIGINT PK</text>
  <text x="740" y="634" class="field">document_id BIGINT FK -> BUSINESS_DOCUMENT.id</text>
  <text x="740" y="654" class="field">item_id BIGINT FK -> ITEM.id</text>
  <text x="740" y="674" class="field">quantity/unit_price/tax_rate DECIMAL</text>

  <line x1="340" y1="150" x2="390" y2="150" class="line" />
  <line x1="340" y1="170" x2="740" y2="170" class="line" />
  <line x1="1040" y1="170" x2="1090" y2="170" class="line" />
  <line x1="200" y1="250" x2="350" y2="330" class="line" />
  <line x1="560" y1="415" x2="690" y2="390" class="line" />
  <line x1="640" y1="415" x2="1030" y2="375" class="line" />
  <line x1="900" y1="450" x2="920" y2="560" class="line" />
  <line x1="1140" y1="220" x2="980" y2="560" class="line" />

  <text x="410" y="140" class="label">herencia JOINED</text>
  <text x="760" y="160" class="label">herencia JOINED</text>
  <text x="250" y="310" class="label">1 Party -> N Documentos</text>
  <text x="640" y="380" class="label">herencia</text>
  <text x="1010" y="362" class="label">herencia</text>
  <text x="925" y="540" class="label">1 Documento -> N Lineas</text>
  <text x="995" y="510" class="label">1 Item -> N Lineas</text>
</svg>
